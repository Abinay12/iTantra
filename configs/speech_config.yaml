# Speech Processing Configuration for iTantra

audio:
  sample_rate: 16000      # Standard sampling rate for speech processing (Hz)
  num_channels: 1         # Mono audio
  bit_depth: 16           # 16-bit PCM
  hop_length: 256         # STFT hop length
  n_fft: 1024             # STFT FFT size
  n_mels: 80              # Number of Mel filterbank bins

languages:
  supported:
    - code: "te"
      name: "Telugu"
      script: "Telugu"
      locale: "te-IN"
      mms_model_id: "facebook/mms-tts-tel"
      neural_voice: "te-IN-MohanNeural"
      tts_available: true
      stt_available: true
      in_scope: true
      tts_verified: true
      status: "fully_supported"
      verification_status: "verified"
